[package]
name = "kernelsentinel"
version = "0.3.3"
edition = "2024"
description = "Runtime detection engine for Linux post-exploitation and privilege-escalation behavior, using eBPF"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["ebpf", "security", "edr", "linux", "detection"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
clap = { version = "4.6.6", features = ["derive"] }
hmac = "0.12"
libbpf-rs = { version = "0.27.0", optional = true }
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.20", features = ["dangerous_configuration"] }
rustls-native-certs = "0.6"
rustls-pemfile = "1"
yara-x = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.10"
tiny_http = { version = "0.12.0", features = ["ssl-rustls"] }

[features]
# The eBPF collector. On by default: a host agent needs it.
#
# Building without it (`--no-default-features`) produces a binary that can
# serve, ship, replay, investigate, baseline and validate rules, but cannot
# collect -- and, crucially, needs no clang, no libbpf and no vmlinux.h, because
# build.rs skips compiling the BPF object entirely. That is the build for a
# central server, which never runs a sensor.
default = ["bpf"]
bpf = ["dep:libbpf-rs", "dep:libbpf-cargo"]

[build-dependencies]
libbpf-cargo = { version = "0.27.0", optional = true }
