# One-off environment probe, run by hand.
#
# CI attaches the sensors on the runner's kernel, but that kernel has no `bpf`
# in its LSM list and a hosted runner cannot be rebooted with a different
# command line. So six of eleven sensors -- file_open, path_chmod,
# inode_setxattr, ptrace, bprm_check, socket_connect, which is most of the
# detection surface -- have never fired anywhere except one developer machine.
#
# The way out is to boot a kernel under QEMU with `lsm=...,bpf` appended. The
# runner's own kernel already has CONFIG_BPF_LSM=y compiled in, so in principle
# nothing has to be downloaded or built: same kernel, one changed boot
# parameter, BPF-LSM active.
#
# Whether that is cheap or painful depends on two facts about the runner that
# are easier to measure than to look up, and which change over time. This job
# answers them and nothing else. It is not part of CI.
name: VM spike

on:
  workflow_dispatch:

jobs:
  probe:
    name: what can this runner virtualise
    runs-on: ubuntu-latest
    steps:
      - name: Hardware virtualisation
        # With /dev/kvm a boot takes seconds; without it QEMU falls back to
        # software emulation, which is tolerable for a minimal boot and painful
        # for a full cloud image. This decides which design is worth building.
        run: |
          echo "--- /dev/kvm ---"
          ls -l /dev/kvm 2>&1 || echo "absent"
          echo "--- cpu flags ---"
          grep -o -m1 -E 'vmx|svm' /proc/cpuinfo || echo "no virtualisation extensions"
          echo "--- groups ---"
          id

      - name: Is the runner's own kernel reusable
        # Reusing it avoids downloading or building anything. Needs the image
        # and, for a 9p/virtiofs root, nothing else -- but the config must
        # actually have BPF-LSM compiled in, which is the whole premise.
        run: |
          echo "--- running kernel ---"
          uname -r
          echo "--- /boot ---"
          ls -l /boot/ 2>&1 | head -20
          echo "--- BPF LSM in the config ---"
          if [ -r "/boot/config-$(uname -r)" ]; then
            grep -E 'CONFIG_BPF_LSM|CONFIG_LSM=' "/boot/config-$(uname -r)" || echo "not found in config"
          else
            echo "no /boot/config-$(uname -r); trying /proc/config.gz"
            zcat /proc/config.gz 2>/dev/null | grep -E 'CONFIG_BPF_LSM|CONFIG_LSM=' || echo "unavailable"
          fi
          echo "--- current cmdline ---"
          cat /proc/cmdline
          echo "--- active lsm list ---"
          cat /sys/kernel/security/lsm 2>&1 || echo "unreadable"

      - name: QEMU availability
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils 2>&1 | tail -2
          qemu-system-x86_64 --version | head -1
          echo "--- accelerators ---"
          qemu-system-x86_64 -accel help 2>&1 | head -10

      - name: Does a KVM boot actually work
        # The decisive test. -accel kvm fails loudly if the device is missing or
        # unusable, which is more reliable than inferring it from /dev/kvm's
        # existence and permissions.
        run: |
          if qemu-system-x86_64 -accel kvm -nographic -no-reboot -kernel /dev/null 2>&1 | head -5; then
            echo "(the kernel argument is deliberately bogus; only the accelerator error matters)"
          fi
