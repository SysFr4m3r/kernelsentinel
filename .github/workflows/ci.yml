name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev zlib1g-dev libbpf-dev \
                                   linux-tools-common linux-tools-generic

      - name: Generate vmlinux.h from the runner's BTF
        # vmlinux.h is host-specific and gitignored; CO-RE lets us regenerate it
        # from the runner's own kernel BTF, exactly as a developer does locally.
        # The script picks a bpftool that can actually parse this kernel's BTF --
        # see its header for why the packaged one frequently cannot.
        run: ./scripts/gen-vmlinux.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        # The detection tests replay real captures unprivileged and
        # deterministically -- no root, no BPF attach required.
        run: cargo test --verbose

      - name: Validate shipped rules
        run: cargo run --quiet -- rules --dir rules
