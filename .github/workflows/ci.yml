name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. Without it, a push event that GitHub does not schedule --
  # a runner-pool hiccup, a queue that never surfaces -- leaves no way to run
  # CI at all except by pushing another commit.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev zlib1g-dev libbpf-dev \
                                   linux-tools-common linux-tools-generic

      - name: Generate vmlinux.h from the runner's BTF
        # vmlinux.h is host-specific and gitignored; CO-RE lets us regenerate it
        # from the runner's own kernel BTF, exactly as a developer does locally.
        # The script picks a bpftool that can actually parse this kernel's BTF --
        # see its header for why the packaged one frequently cannot.
        run: ./scripts/gen-vmlinux.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        # The detection tests replay real captures unprivileged and
        # deterministically -- no root, no BPF attach required.
        run: cargo test --verbose

      - name: Validate shipped rules
        run: cargo run --quiet -- rules --dir rules

  # The check CI never had: load the object into a kernel.
  #
  # Everything above compiles the BPF object and runs unprivileged replay tests,
  # so until now every claim about *attaching* rested on one developer machine --
  # which attaches 11 of 11 and therefore cannot exercise the path where some
  # sensors are unavailable. The runner is a different kernel with a different
  # LSM configuration, which makes it a genuine second data point and, most
  # likely, the first test of the degradation path.
  attach:
    name: attach on the runner kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev zlib1g-dev libbpf-dev \
                                   linux-tools-common linux-tools-generic

      - name: Generate vmlinux.h from the runner's BTF
        run: ./scripts/gen-vmlinux.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: What kernel and compiler is this
        # Both matter and they are not the same question. release.yml pins
        # clang-15; this job takes the runner image's default, which is how the
        # two workflows came to build the object with different compilers -- and
        # why a verifier rejection could appear here while every published
        # release loaded fine.
        run: |
          clang --version | head -1
          uname -a
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unreadable)"
          echo "btf: $(ls -l /sys/kernel/btf/vmlinux 2>/dev/null || echo absent)"

      - name: Attach the sensors
        # Asserts the object loads and `exec` attaches -- not that all eleven do.
        # A kernel without BPF-LSM losing six sensors is documented, supported
        # behaviour, and demanding the full set here would fail every correctly
        # degrading kernel and pass only on machines like the author's.
        run: sudo -E ./scripts/compat-probe.sh

  # aarch64. The compatibility table claims x86_64 and aarch64; build.rs rejects
  # anything else at compile time, which is an assertion about what we refuse,
  # not evidence that arm64 works. Nothing has ever built or attached there.
  #
  # A separate job rather than a matrix on `attach`, so if arm runners are not
  # available to this repo the x86_64 result still arrives instead of the whole
  # workflow waiting on a label nobody will service.
  attach-arm64:
    name: attach on aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev zlib1g-dev libbpf-dev \
                                   linux-tools-common linux-tools-generic

      - name: Generate vmlinux.h from the runner's BTF
        run: ./scripts/gen-vmlinux.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: What kernel and compiler is this
        run: |
          clang --version | head -1
          uname -a

      - name: Build
        run: cargo build

      - name: Test
        # The detection logic is architecture-independent, but the wire layout
        # is not: tests/wire_layout.rs compares struct event against its Rust
        # mirror under C alignment rules, and that is worth running somewhere
        # other than x86_64.
        run: cargo test

      - name: Attach the sensors
        run: sudo -E ./scripts/compat-probe.sh

  # The six lsm/ sensors, on a kernel where they can actually fire.
  #
  # The runner's kernel has CONFIG_BPF_LSM=y but no `bpf` in its LSM list, and a
  # hosted runner cannot be rebooted with a different command line -- so the
  # `attach` job above correctly reports 5 of 11 and cannot test the other six.
  # That is most of the detection surface, and until now it fired nowhere except
  # one developer machine.
  #
  # The kernel is not the obstacle, the boot parameter is. Boot the same image
  # under QEMU with lsm=...,bpf appended and all eleven come up.
  lsm-vm:
    name: lsm sensors in a VM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install BPF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev zlib1g-dev libbpf-dev \
                                   linux-tools-common linux-tools-generic

      - name: Generate vmlinux.h from the runner's BTF
        run: ./scripts/gen-vmlinux.sh

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build

      - name: Install QEMU and initramfs tools
        run: sudo apt-get install -y qemu-system-x86 busybox-static cpio

      - name: Make KVM usable
        # The runner has /dev/kvm as root:kvm 0660 and the runner user is not in
        # the kvm group. Without this the boot still works under emulation, just
        # slower, so this is an optimisation and not a requirement.
        run: |
          sudo chmod 666 /dev/kvm || echo "no /dev/kvm; the VM will use emulation"
          ls -l /dev/kvm || true

      - name: Take a readable copy of the running kernel
        # /boot/vmlinuz-* is mode 0600 root:root on the runner.
        run: |
          sudo cp "/boot/vmlinuz-$(uname -r)" /tmp/vmlinuz
          sudo chmod 644 /tmp/vmlinuz
          ls -l /tmp/vmlinuz

      - name: Boot with bpf in the LSM list and check the sensors fire
        # Fails if only `exec` answered: that would mean the guest came up
        # without the bpf LSM, so the run tested nothing the `attach` job does
        # not already cover, and passing it would be worse than failing.
        run: ./tests/vm/run.sh /tmp/vmlinuz
