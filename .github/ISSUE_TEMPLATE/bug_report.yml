name: Bug report
description: Something is broken that is not a detection problem
title: "bug: <summary>"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "kernelsentinel --version, or the commit"
    validations:
      required: true
